# Application
spring.application.name=Backend-Braiding

# Server
server.port=${PORT:8080}

#Database - Postgresql
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/braiding}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:your_db_password}
spring.datasource.driver-class-name=org.postgresql.Driver

 
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.packagesToScan=model
spring.jpa.properties.packagesToScan=model

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:1800000}
jwt.refresh-expiration=604800000
auth.cookie-name=${AUTH_COOKIE_NAME:ah_admin_session}
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie-domain=${AUTH_COOKIE_DOMAIN:}
auth.remember-duration-seconds=${AUTH_REMEMBER_DURATION_SECONDS:604800}
auth.google-client-id=${GOOGLE_CLIENT_ID:}
auth.setup-secret=${ADMIN_SETUP_SECRET:}
app.frontend-url=${FRONTEND_URL:https://hair-braiding-coral.vercel.app}

# Stripe API Keys
stripe.api.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.reconciliation.interval-ms=${STRIPE_RECONCILIATION_INTERVAL_MS:300000}
booking.rate-limit.requests-per-minute=${BOOKING_RATE_LIMIT_PER_MINUTE:20}

# Customer-facing salon identity used in appointment notifications
salon.name=${SALON_NAME:AH Braiding Salon}
salon.phone=${SALON_PHONE:(210) 812-8121}
salon.email=${SALON_EMAIL:adjiashairbraiding@gmail.com}
salon.address-line-1=${SALON_ADDRESS_LINE_1:1305 SW Loop 410, Unit 203}
salon.address-line-2=${SALON_ADDRESS_LINE_2:San Antonio, TX 78227}
salon.hours.weekday=${SALON_HOURS_WEEKDAY:Monday-Saturday: 9:00 AM-7:00 PM}
salon.hours.sunday=${SALON_HOURS_SUNDAY:Sunday: 10:00 AM–5:00 PM}
salon.website=${SALON_WEBSITE:}

# Email Configuration (Gmail example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-specific-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
notifications.email.required=${EMAIL_REQUIRED:false}
notifications.outbox.interval-ms=${NOTIFICATION_OUTBOX_INTERVAL_MS:10000}

# CORS
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://hair-braiding-coral.vercel.app}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Vonage (Nexmo) SMS Configuration
vonage.api.key=${VONAGE_API_KEY:your_vonage_api_key}
vonage.api.secret=${VONAGE_API_SECRET:your_vonage_api_secret}
vonage.phone.number=${VONAGE_PHONE_NUMBER:your_vonage_phone_number}
