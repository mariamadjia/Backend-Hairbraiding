services:
  - type: web
    name: ah-braiding-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      - key: VONAGE_PHONE_NUMBER
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SALON_EMAIL
        value: adjiashairbraiding@gmail.com
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_REQUIRED
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
